name: Talaqa
options:
  bundleIdPrefix: com.talaqa
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Talaqa:
    type: application
    platform: iOS
    sources:
      - path: Talaqa
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.talaqa.app
        PRODUCT_NAME: Talaqa
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    info:
      path: Talaqa/Info.plist
      properties:
        CFBundleDisplayName: طلاقة
        CFBundleDevelopmentRegion: ar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: يستخدم التطبيق الميكروفون لتقييم نطقك والتحدث مع المعلّم الذكي.
        NSSpeechRecognitionUsageDescription: يستخدم التطبيق التعرّف على الكلام لتحويل صوتك إلى نص وتقييم نطقك.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
